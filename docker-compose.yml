# Local MongoDB for development. Started with `pnpm db:up`.
#
# A single-node replica set (rs0) is used rather than a standalone server so that
# multi-document transactions and change streams work the same way locally as they
# would in production. The healthcheck initiates the replica set on first boot, so
# no separate init container is needed.
services:
  mongo:
    image: mongo:7
    container_name: ubmp-mongo
    restart: unless-stopped
    command: ['--replSet', 'rs0', '--bind_ip_all', '--port', '27017']
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # Idempotent: reports ok once the set is up, and initiates it if it is not.
      test: |
        mongosh --quiet --port 27017 --eval "
          try { rs.status().ok }
          catch (e) {
            rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] }).ok
          }
        "
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

  # Optional web UI for inspecting collections during development.
  # Started only on demand: `docker compose --profile tools up -d mongo-express`
  mongo-express:
    image: mongo-express:1.0.2
    container_name: ubmp-mongo-express
    profiles: ['tools']
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - '8081:8081'
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongo:27017/?replicaSet=rs0&directConnection=true
      ME_CONFIG_BASICAUTH: 'false'

volumes:
  mongo-data:
